# corpus/sources.yaml — provenance du corpus agronomique sahelien (ADTC 2026)
#
# DEUX REGIMES, et la distinction est juridique, pas technique :
#
#   regime: committed  licence explicitement permissive (CC BY / CC BY-NC).
#                      Le texte extrait EST committe dans corpus/txt/, avec
#                      attribution. C'est le socle citable verbatim.
#
#   regime: fetched    aucune licence declaree par l'editeur (institutionnels
#                      publics). On ne redistribue RIEN : corpus/fetch_corpus.sh
#                      telecharge chez l'editeur avec la taille attendue, et
#                      l'extraction se fait localement.
#
# Ce que `licence: null` veut dire : « aucune mention juridique trouvee dans le
# PDF (pages 1-4 et 2 dernieres sondees) ». Cela ne veut PAS dire « libre ».
#
# `licence_confirmee_dans_le_pdf` n'est true que si la mention a ete LUE dans le
# fichier, pas sur le site de l'editeur. Les deux peuvent se contredire : la page
# web d'Agrodok annonce « download, share, copy » et sa page 3 imprime « tous
# droits reserves, aucune reproduction meme partielle ». C'est pourquoi ce champ
# existe.
#
# `car_page` = caracteres par page mesures (6 pages echantillonnees). Un document
# a 0 car/page est un scan : inexploitable sans OCR, donc exclu.
#
# ─── APRÈS AUDIT (patch_sources.py, mesure du 2026-08-16) ─────────────────────
# Chaque entrée a été TÉLÉCHARGÉE, sa taille vérifiée à l'octet, son texte sondé
# page par page, et sa licence cherchée dans TOUTES les pages du fichier.
#
# Ce que l'audit a changé, et qu'aucune métadonnée de dépôt ne disait :
#   - 2 documents annoncés `cc_attribution` par ICRISAT OAR sont en réalité l'un
#     CC BY-NC-**ND** (interdit l'index, qui est une œuvre dérivée), l'autre
#     « All rights reserved ». Ils sont RETIRÉS.
#   - 2 documents annoncés `cc_attribution` ne portent AUCUNE mention dans le
#     fichier. Rétrogradés en `fetched` : pas de redistribution sur la foi d'un
#     champ de dépôt.
#   - 1 document (`oar_57448`) semblait sans licence : sa CC BY est en p14 sur 16
#     (Springer imprime le bloc Open Access après les Déclarations). Ma première
#     sonde n'échantillonnait que p1-4 + 2 dernières — elle le perdait.
#   - Piège Wiley écarté : « OA articles are governed by the *applicable* Creative
#     Commons License », répété sur 20 pages, ne NOMME aucune variante. Chez Wiley
#     un article OA peut être CC BY, CC BY-NC ou CC BY-NC-ND ⇒ ne prouve rien.
#
# `utilite_conseil` est le SEUL champ qui soit un jugement et non une mesure :
#   directe / indirecte / methodologique. Les `methodologique` (télédétection,
#   génomique, priorisation) ne seront PAS indexés au D4 : ils produiraient du
#   bruit sourcé, pire qu'une absence de réponse.
#
# ─── APPORTS RECA NIGER (merge_reca.py, 2026-08-16) ───────────────────────────
# 21 documents francophones ajoutes, tous mesures : taille verifiee a l'octet,
# extractibilite sondee page par page (sonde v3), editeur LU en p1-3 du PDF.
#
# Pourquoi cet ajout : l'audit du socle CC BY a montre que les 14 documents
# anglophones sont du CONTEXTE (articles scientifiques), et que le conseil
# agronomique *direct* — date de semis, densite, dose, seuil d'intervention —
# ne vivait que dans 6 fiches francaises. Or c'est exactement ce que la moitie
# jugee du score recompense. Le bucket francophone passe de 6 a 27 documents.
#
# Ce que la mesure a corrige, et qu'aucun nom de fichier ne disait :
#   - `foreurs_de_tiges_inran.pdf` n'est PAS de l'INRAN : c'est un article de
#     *IOSR Journal of Agriculture and Veterinary Science* 11(6) 2018. Le nom du
#     fichier heberge nommait un institut qui n'est pas l'emetteur.
#   - 2 catalogues varietes 2012 ECARTES : 10 % et 11 % de pages textuelles,
#     medianes a 0 — des scans avec une page de texte. Ma premiere sonde les
#     laissait passer a 283 car/page de MOYENNE.
#   - Le Catalogue CNEV est `PARTIEL` : 54 % de pages utiles mais 112 665 car —
#     il se garde AVEC filtrage page a page, il ne se jette pas.
#
# Regime : `fetched` sans exception. RECA ne declare aucune licence, et un
# document d'Etat n'est pas pour autant republiable.
